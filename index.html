    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            background-color: #FFF9F0;
            color: #453A39;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .clay-card {
            background: #FFE8D8;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(69, 58, 57, 0.12), 0 8px 10px -6px rgba(69, 58, 57, 0.08), inset 0 2px 4px rgba(255, 255, 255, 0.6);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .clay-card-interactive:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px -5px rgba(69, 58, 57, 0.18), 0 10px 12px -6px rgba(69, 58, 57, 0.1), inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .clay-card-interactive:active {
            transform: scale(0.98);
        }

        .clay-button {
            border-radius: 16px;
            box-shadow: 0 6px 15px -3px rgba(69, 58, 57, 0.15), inset 0 2px 3px rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }
        .clay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -3px rgba(69, 58, 57, 0.2);
        }
        .clay-button:active {
            transform: scale(0.96);
        }

        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-gentle {
            animation: bounce-gentle 2.2s ease-in-out infinite;
        }

        @keyframes wobble-soft {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }
        .animate-wobble {
            animation: wobble-soft 0.4s ease-in-out;
        }

        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slide-in-up {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slide-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        const TIMING_CONFIG = {

        let choicesRevealedCount = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!settings.sound) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'incorrect') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function goToHome() {
            playSound('click');
            clearAllTimers();
            currentScreen = 'home';
            document.getElementById('quiz-header-info').classList.add('hidden');
            render();
        }

        function startQuiz(quizIndex) {
            playSound('click');
            currentQuizIndex = quizIndex;
            currentQuestionIndex = 0;
            score = 0;
            
            const originalQuestions = quizzesData[quizIndex].questions;
            shuffledQuestions = [...originalQuestions].sort(() => Math.random() - 0.5);
            
            currentScreen = 'quiz';
            document.getElementById('quiz-header-info').classList.remove('hidden');
            document.getElementById('topic-badge').innerText = quizzesData[quizIndex].title;
            
            prepareCurrentQuestion();
        }

        function clearAllTimers() {
            if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
            if (questionReadTimer) clearTimeout(questionReadTimer);
            if (choiceRevealInterval) clearTimeout(choiceRevealInterval);
            autoAdvanceTimer = null;
            questionReadTimer = null;
            choiceRevealInterval = null;
        }

        function prepareCurrentQuestion() {
            clearAllTimers();

            const qData = shuffledQuestions[currentQuestionIndex];
            selectedChoiceIndex = null;
            isAnswerSubmitted = false;
            hintUsed = false;
            choicesRevealedCount = 0;

            let indexedChoices = qData.choices.map((text, idx) => ({ text, originalIdx: idx }));
            indexedChoices.sort(() => Math.random() - 0.5);
            currentChoices = indexedChoices;

            render();
            startStagedReveal();
        }

        function startStagedReveal() {
            questionReadTimer = setTimeout(() => {
                revealNextChoiceBatch();
            }, TIMING_CONFIG.readingPause);
        }

        function revealNextChoiceBatch() {
            if (choicesRevealedCount < currentChoices.length) {
                choicesRevealedCount++;
                playSound('click');
                render();
                if (choicesRevealedCount < currentChoices.length) {
                    choiceRevealInterval = setTimeout(revealNextChoiceBatch, TIMING_CONFIG.choiceInterval);
                }
            }
        }

        function selectChoice(choiceIndex) {
            if (isAnswerSubmitted) return;
            
            if (choicesRevealedCount < currentChoices.length) {
                clearAllTimers();
                choicesRevealedCount = currentChoices.length;
            }

            isAnswerSubmitted = true;
            selectedChoiceIndex = choiceIndex;
            
            const qData = shuffledQuestions[currentQuestionIndex];
            const chosenObj = currentChoices[choiceIndex];
            const feedbackEl = document.getElementById('feedback-container');

            if (chosenObj.originalIdx === qData.correct) {
                score++;
                playSound('correct');
                if (feedbackEl) {
                    feedbackEl.innerHTML = `<span class="text-successgreen animate-pop">✅ ${qData.feedback}</span>`;
                }
                autoAdvanceTimer = setTimeout(() => {
                    nextQuestion();
                }, 1000);
            } else {
                playSound('incorrect');
                const correctChoiceText = qData.choices[qData.correct];
                if (feedbackEl) {
                    feedbackEl.innerHTML = `<span class="text-errorcoral animate-pop">❌ Not quite! Correct answer: <strong>${correctChoiceText}</strong></span>`;
                }
                autoAdvanceTimer = setTimeout(() => {
                    nextQuestion();
                }, 2200);
            }

            render();
        }

        function nextQuestion() {
            clearAllTimers();
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                prepareCurrentQuestion();
                render();
            } else {
                currentScreen = 'results';
                document.getElementById('quiz-header-info').classList.add('hidden');
                render();
            }
